services:
  postgres:
    image: postgres:16-alpine
    container_name: localsiem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localsiem}
      POSTGRES_USER: ${POSTGRES_USER:-localsiem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - localsiem-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localsiem} -d ${POSTGRES_DB:-localsiem}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  localsiem-pgdata:
